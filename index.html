<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <div class="header">
            <h1>📚 Biblioteca Escolar</h1>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Faça login para continuar</p>
        </div>
        <div class="tab-content active" style="display: block;">
            <form id="form-login">
                <h2>Entrar</h2>
                <input type="email" id="login-email" placeholder="E-mail" required>
                <input type="password" id="login-senha" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border);">
            
            <form id="form-registro">
                <h2>Criar Conta</h2>
                <input type="text" id="reg-nome" placeholder="Nome Completo" required>
                <input type="email" id="reg-email" placeholder="E-mail" required>
                <input type="password" id="reg-senha" placeholder="Senha (mín 6 caracteres)" required>
                <select id="reg-tipo">
                    <option value="aluno">Sou Aluno</option>
                    <option value="bibliotecario">Sou Bibliotecário</option>
                </select>
                <button type="submit" style="background-color: var(--success);">Cadastrar</button>
            </form>
        </div>
    </div>
</body>
</html>
