<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - Aluno</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js" defer></script>
    <script src="js/aluno.js" defer></script>
</head>
<body>
    <div class="layout">
        
        <!-- MENU LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-brand">🎒 Aluno</div>
            
            <nav class="sidebar-nav">
                <button class="nav-link active" onclick="mudarAba('livros', event)">
                    <span>📚</span> Estante Virtual
                </button>
                <button class="nav-link" onclick="mudarAba('meus-emprestimos', event)">
                    <span>⏳</span> Meus Empréstimos
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <span>Olá,</span>
                    <strong id="user-nome">Carregando...</strong>
                </div>
                <div class="footer-btns">
                    <button class="btn-icon" onclick="abrirConfig()" title="Configurações">⚙️</button>
                    <button class="btn-sair-sidebar" onclick="fazerLogout()">Sair</button>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            <div class="top-header">
                <h1>Minha Biblioteca</h1>
            </div>

            <!-- ABA DE LIVROS (ESTANTE) -->
            <div id="aba-livros" class="tab-content active">
                <h2>Estante Virtual</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Clique em um livro para pegá-lo emprestado (Prazo de 7 dias).</p>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Pesquisar por título, autor ou categoria..." oninput="filtrarLivros()" style="padding-left: 20px;">
                </div>

                <!-- A mágica acontece aqui -->
                <div id="estante-container"></div>
            </div>

            <!-- ABA MEUS EMPRÉSTIMOS -->
            <div id="aba-meus-emprestimos" class="tab-content">
                <h2>Meus Livros Emprestados</h2>
                <table id="tabela-emprestimos">
                    <thead><tr><th>Livro</th><th>Devolução Prevista</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="modal-config" class="modal-overlay">
        <div class="modal-box">
            <h2>Meu Perfil</h2>
            <p><strong>Nome:</strong> <span id="conf-nome">...</span></p>
            <p><strong>E-mail:</strong> <span id="conf-email">...</span></p>
            <p><strong>Função:</strong> <span id="conf-tipo">...</span></p>
            <p><strong>Turma:</strong> <span id="conf-turma">-</span></p>
            <p><strong>Matrícula:</strong> <span id="conf-matricula">-</span></p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border);">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600;">
                <input type="checkbox" id="check-dark" onchange="alternarTema()" style="width: auto; margin: 0;"> Ativar Modo Escuro 🌙
            </label>
            <button class="close-btn" onclick="fecharConfig()">Fechar</button>
        </div>
    </div>
</body>
</html>
