<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - Aluno</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js" defer></script>
    <script src="js/aluno.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Barra de Usuário -->
        <div class="user-bar">
            <span>Olá, <strong id="user-nome">...</strong> (🎒 Aluno)</span>
            <div>
                <button type="button" onclick="abrirConfig()" class="btn-config">⚙️ Configurações</button>
                <button type="button" onclick="fazerLogout()" class="btn-sair">Sair</button>
            </div>
        </div>

        <div class="header"><h1>🎒 Meu Painel</h1></div>

        <!-- Abas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('livros', event)">Consultar Acervo</button>
            <button class="tab-btn" onclick="mudarAba('meus-emprestimos', event)">Meus Empréstimos</button>
        </div>

               <!-- ABA LIVROS (ESTANTE) -->
               <div id="aba-livros" class="tab-content active">
                <h2>Estante da Biblioteca</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Clique em um livro verde para pegá-lo emprestado (Prazo de 7 dias).</p>
                
                <!-- A mágica acontece aqui -->
                <div id="estante-container"></div>
            </div>

        <!-- ABA MEUS EMPRÉSTIMOS -->
        <div id="aba-meus-emprestimos" class="tab-content">
            <h2>Meus Livros Emprestados</h2>
            <table id="tabela-emprestimos">
                <thead><tr><th>Livro</th><th>Devolução Prevista</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div> <!-- FIM DA DIV CONTAINER -->

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="modal-config" class="modal-overlay">
        <div class="modal-box">
            <h2>Meu Perfil</h2>
            <p><strong>Nome:</strong> <span id="conf-nome">...</span></p>
            <p><strong>E-mail:</strong> <span id="conf-email">...</span></p>
            <p><strong>Função:</strong> <span id="conf-tipo">...</span></p>
            <p><strong>Turma:</strong> <span id="conf-turma">-</span></p>
            <p><strong>Matrícula:</strong> <span id="conf-matricula">-</span></p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border);">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600;">
                <input type="checkbox" id="check-dark" onchange="alternarTema()" style="width: auto; margin: 0;"> Ativar Modo Escuro 🌙
            </label>
            <button class="close-btn" onclick="fecharConfig()">Fechar</button>
        </div>
    </div>

</body>
</html>
